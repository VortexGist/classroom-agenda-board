<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Classroom Agenda Board</title>
    <link rel='stylesheet' href='./../css/style.css'>
</head>
<body>
    <!-- Lagay ka rito ng mga html structure ng mga tabs pati rin yung designs as well 
     para malaman ko what would work habang inaasikaso ko yung mga technical database stuff
     -->
     <div class="app">
         <header>
             <h1 id="pageTitle">Announcement</h1>
             <!--dan mag add ako dito ng search bar para pwede nilang balik balikan ung mga task na naskip nila-->
              <input type="text" id="searchInput" placeholder="Search Announcement" oninput="searchItems()">
         </header>
         <!--content-->
         <main>
             <div class="cards" id="cards-container">
                 <div class="card">
                     <h3>Announcement</h3>
                     <p></p>
                 </div>
                 
                 <div class="card">
                     <h3>Announcement</h3><p></p>
                 </div>
                 
                 <div class="card">
                     <h3>Announcement</h3>
                     <p></p>
                 </div>
                 
                 <div class="card">
                     <h3>Announcement</h3><p></p>
                 </div>
                 
                 <div class="card">
                     <h3>Announcement</h3><p></p>
                 </div>
                 
                 <div class="card">
                     <h3>Announcement</h3><p></p>
                 </div>
             </div>
             
             <!--add button-->
             <div class="add-area"><button onclick="addItem()">+</button>
             </div>
             </main>
             
            <!--bottom tabs-->
            <nav class="bottom-tabs">
                <button
                class="tab active" onclick="changeTab('Announcement')"><span class="tab-icon">📣</span><span>Announcements</span></button>
                
                <button
                class="tab"
                onclick="changeTab('Classroom Task')">

                <span class="tab-icon">📝</span>
                <span>Classroom Task</span>
            </button>
            
            <button
                class="tab"
                onclick="changeTab('Subject Activities')">

                <span class="tab-icon">📖</span>
                <span>Subject Activities</span>
            </button>
            </nav>
     </div>
    <script src="./../js/app.js"></script>
    <script src="./../js/database.js"></script>    
    <script src="./../js/agenda.js"></script>
</body>
</html>
