<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Agenda Board</title>
    <link rel="stylesheet" href="./css/default-styles.css">
    <link rel="stylesheet" href="./css/app-layout.css">
    <link rel="stylesheet" href="./css/components.css">
</head>

<body>
    <div id="app-top-bar">
        <p id="app-name">Classroom Agenda Hub</p>
    </div>
    <div id="app-content">
        <!-- ANNOUNCEMENTS -->
        <div id="tab-announcements">
            <button id="btn-create-announcement">+</button>
            <div id="announcement-editor" class="hidden">
                <h1 id="announcement-editor-title">New Announcement</h1>
                <label>Title:</label>
                <input id="input-announcement-title" type="text">
                <label>Description:</label>
                <textarea id="input-announcement-description" rows="10" cols="100" value=""></textarea>
                <button id="btn-confirm-create-announcement">Create Announcement</button>
                <button id="btn-cancel-create-announcement">Cancel</button>
            </div>
            <div id="announcement-list" class="flexbox">
                <div class="item">
                    <p class="item-title">Get Started</p>
                    <p class="item-description">Create a new announcement by clicking the plus button on the bottom right</p>
                </div>
            </div>
        </div>
        <!-- CLASSROOM TASKS -->
        <div id="tab-classroom-tasks" class="hidden">
            <h1>Classroom Tasks</h1>
        </div>
        <!-- SUBJECT ACTIVITIES -->
        <div id="tab-subject-activities" class="hidden">
            <h1>Subject Activities</h1>
        </div>
    </div>
    <div id="app-bottom-bar">
        <div class="tab-ribbon">
            <button id="btn-announcements" class="ribbon-item selected">📣Announcements</button>
            <button id="btn-classroom-tasks" class="ribbon-item">📝Classroom Tasks</button>
            <button id="btn-subject-activities" class="ribbon-item">📖Subject Activities</button>
        </div>
    </div>
    <script src="./js/database.js"></script>
    <script src="./js/agenda.js"></script>
    <script src="./js/app.js"></script>
    <script type="text/javascript">
        function toast() {
            // let div = document.createElement("div");

            // classList

            let body = document.querySelector("body");
        }

        let buttons = [
            document.querySelector("#btn-announcements"),
            document.querySelector("#btn-classroom-tasks"),
            document.querySelector("#btn-subject-activities")
        ];

        let tabs = [
            document.querySelector("#tab-announcements"),
            document.querySelector("#tab-classroom-tasks"),
            document.querySelector("#tab-subject-activities"),
        ];

        for (let i = 0; i < buttons.length; i++) {
            let btn = buttons[i];
            let tab = tabs[i];
            btn.onclick = () => {
                if (!btn.classList.contains("selected")) {
                    // Hide and deselect all tabs and tab buttons
                    for (let j = 0; j < buttons.length; j++) {
                        let b = buttons[j];
                        b.classList.remove("selected");
                        let t = tabs[j];
                        if (!t.classList.contains("hidden")) {
                            t.classList.add("hidden");
                        }
                    }
                    // Show current tab
                    tab.classList.remove("hidden");
                    // Select current tab button
                    btn.classList.add("selected");
                }
            };
        }

        document.querySelector("#btn-cancel-create-announcement").onclick = () => {
            // Close editor
            let editor = document.querySelector("#announcement-editor");
            let list = document.querySelector("#announcement-list");

            editor.classList.add("hidden");
            list.classList.remove("hidden");
        };

        document.querySelector("#btn-create-announcement").onclick = () => {
            let editor = document.querySelector("#announcement-editor");
            let list = document.querySelector("#announcement-list");

            // Close-open editor and list
            if (editor.classList.contains("hidden")) {
                editor.classList.remove("hidden");
                list.classList.add("hidden");
            } else if (list.classList.contains("hidden")) {
                editor.classList.add("hidden");
                list.classList.remove("hidden");
            }
        };

        document.querySelector("#btn-confirm-create-announcement").onclick = () => {
            // Construct announcement item
            let item = document.createElement("div");
            item.classList.add("item");

            let itemTitle = document.createElement("p");
            itemTitle.classList.add("item-title");
            itemTitle.innerHTML = document.querySelector("#input-announcement-title").value;

            let itemDescription = document.createElement("p");
            itemDescription.classList.add("item-description");
            itemDescription.innerHTML = document.querySelector("#input-announcement-description").value;

            item.append(itemTitle);
            item.append(itemDescription);

            // Add announcement to list
            document.querySelector("#announcement-list").append(item);

            // Clear values
            document.querySelector("#input-announcement-title").value = "";
            document.querySelector("#input-announcement-description").value = "";

            // Close editor
            document.querySelector("#announcement-editor").classList.add("hidden");
            document.querySelector("#announcement-list").classList.remove("hidden");
        };
    </script>
</body>

</html>
